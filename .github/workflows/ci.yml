name: CI

# Measured cost (run 34309109787, 2026-09-09, push trigger): ~4 billed
# runner-minutes -- 4 ubuntu-latest jobs (npm-check ~19s, lint-and-test x2
# Python versions ~26-27s each, canary ~13s), each billed rounded up to the
# next minute per GitHub's billing model. This re-measurement corrects the
# prior "~2" figure, which predated canary running unconditionally and
# npm-check existing at all -- re-measure again via
# `gh api .../actions/runs/<id>/jobs` if the job set changes.

on:
  push:
    paths:
      - "xrpl_camp/**"
      - "tests/**"
      - "pyproject.toml"
      - "package.json"
      - "bin/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "atlas/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  # No paths filter on pull requests, deliberately: this workflow emits the
  # required status check, and a PR that matched no path (a docs-only change)
  # would never report it and could never merge. Pushes to main stay
  # paths-gated.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege by default, guaranteed by this file rather than by the
# org/repo "default_workflow_permissions" setting, which could change
# without this file noticing. This is also the one workflow in the domain
# that runs against pull_request (potentially exercising fork contributions).
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.13 is what the project is actually developed on; an earlier
        # revision capped requires-python at <3.13, which would have blocked
        # installation on the very interpreter the suite runs on locally.
        # The studio rule allows 2-3 versions; this is the honest three.
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.python-version == '3.11' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Atlas requires Node 22 or later, and one cell is enough, so the check
      # runs on the Python 3.12 cell only.
      - name: Set up Node for the Atlas check
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Install dependencies
        run: uv sync --dev

      - name: Dependency vulnerability scan
        run: uv run --with pip-audit pip-audit

      - name: Verify (lint + test + build + smoke)
        id: tests
        run: bash scripts/verify.sh

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: lint-and-test
    if: ${{ !cancelled() && needs.lint-and-test.result != 'cancelled' && needs.lint-and-test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codecov-coverage
          path: .

      - name: Download test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.lint-and-test.result == 'success' || hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ needs.lint-and-test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  # Exercises the real CLI runtime path end-to-end, as opposed to
  # lint/unit-test. Runs on every push/PR/dispatch (the workflow-level
  # `on:` above) rather than workflow_dispatch-only -- a gate that can only
  # ever be run by a human choosing to run it, and even then cannot report
  # failure, is worse than no gate. Do not add `|| true` / continue-on-error
  # back onto the smoke step below; a red canary here has real value and
  # must be allowed to fail the job.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - run: uv python install 3.12

      - run: uv sync

      - name: CLI smoke
        run: |
          uv run xrpl-camp --help
          uv run xrpl-camp self-check
          uv run xrpl-camp start --dry-run < /dev/null

  # No workflow anywhere used to reference the npm wrapper at all -- this is one of
  # exactly two distribution channels for this product, and zero CI
  # coverage over it is exactly the kind of gap that let the live npm
  # registry drift to a version (1.3.2) absent from git.
  npm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Syntax check launcher
        run: node -c bin/xrpl-camp.js

      - name: Install npm dependencies (resolves @mcptoolshop/npm-launcher)
        run: npm install

      - name: Packaging dry run
        run: npm pack --dry-run

      # Everything above only checks that the wrapper file parses and that
      # `npm pack` is happy with what ships -- neither ever runs
      # @mcptoolshop/npm-launcher's real download -> checksum-verify -> exec
      # path, which is what every `npx @mcptoolshop/xrpl-camp` invocation
      # actually depends on. Pinned to a fixed, already-published release
      # (1.3.1 -- NOT derived from package.json's in-progress version)
      # so this step's pass/fail depends only on whether the currently
      # resolved npm-launcher can still fetch and run a real asset, not on
      # release timing: the commit that bumps package.json's version
      # routinely lands before the matching tag is pushed, and testing "the
      # current version" would then fail for a reason that has nothing to do
      # with npm-launcher.
      #
      # `--` is load-bearing: mcptoolshop-launch.js treats flags before it as
      # its OWN (--help/--version there print the LAUNCHER's own help and
      # never touch the network); only args after `--` reach the downloaded
      # binary. Verified locally before wiring this in -- including against
      # an older release (v1.0.2) whose Windows binary crashed at this exact
      # invocation with a PyInstaller packaging error, confirming this step
      # has real teeth and isn't just exercising a happy path that can't
      # fail.
      - name: Launcher smoke test (real download + checksum + exec)
        env:
          MCPTOOLSHOP_LAUNCH_CONFIG: '{"toolName":"xrpl-camp","owner":"mcp-tool-shop-org","repo":"xrpl-camp","version":"1.3.1"}'
        run: node node_modules/@mcptoolshop/npm-launcher/bin/mcptoolshop-launch.js -- --help

      - name: Version consistency check
        run: bash scripts/check-versions.sh
