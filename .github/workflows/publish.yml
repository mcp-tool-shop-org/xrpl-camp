# LOAD-BEARING: the filename "publish.yml", the `environment: pypi` on the
# publish-pypi job, and its `permissions: id-token: write` together ARE this
# project's PyPI Trusted Publishing identity. PyPI's Trusted Publisher
# config authenticates against the exact workflow filename + environment
# name, not the workflow `name:` field above. Renaming this file, renaming
# the `pypi` environment, or dropping `id-token: write` breaks publishing in
# a way that will not surface until the next release is cut. Do not rename.
#
# This file used to be PyPI-only, triggered by `on: release: published`,
# with a *separate* release-binaries.yml building platform binaries and
# creating the GitHub Release (via softprops/action-gh-release, authenticated
# as GITHUB_TOKEN). GitHub does not cascade workflow triggers from
# GITHUB_TOKEN-raised events, so this file's `release: published` trigger
# never fired from that path -- confirmed by authorship: v1.3.1 and v1.0.6
# were released by github-actions[bot] via release-binaries.yml and neither
# triggered a PyPI publish; v1.1.0 was released by a human via
# `gh release create` and it fired normally. That gap is the root cause of a
# five-month span where PyPI served 1.1.0 while pyproject.toml moved on
# without it. Merging binary build + GitHub Release + PyPI publish into one
# workflow, triggered directly by the tag push, removes the cross-workflow
# event dependency instead of working around it.
#
# Measured pre-merge baseline (last real runs before this merge):
#   publish.yml alone   (run 23308888312, 2026-03-19): ~1 billed minute
#     (single ubuntu-latest job, ~24s)
#   release-binaries.yml (run 24438297762, 2026-04-15): ~4 raw runner-minutes
#     (1 windows-latest ~60s, 1 macos-latest ~25s, 2 ubuntu-latest ~33s+10s),
#     ~15 minute-equivalents once weighted by GitHub's published OS cost
#     multiplier (windows ~2x, macos ~10x linux).
# Combined, this is the real per-tag-push cost floor for the merged
# workflow below; the new PyPI verification step adds a bounded poll
# (up to ~2.5 min, see scripts/verify-pypi-publish.sh) not reflected in
# the pre-merge figures above since it did not exist yet. Re-measure via
# `gh api repos/mcp-tool-shop-org/xrpl-camp/actions/runs/<id>/jobs` after
# the first real tag push against this file.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Recovery discipline: never re-dispatch this workflow against a tag that
# already has a run in progress -- check the Actions tab first. The group
# below is scoped per-tag with cancel-in-progress: true, so a second trigger
# against the SAME tag (e.g. someone workflow_dispatches it during manual
# release recovery, not realizing the tag-push run is already executing --
# this project has already lived through exactly that kind of pressured
# recovery once, for v1.0.6) cancels the first run. If that cancellation
# lands after github-release has already published binaries but before
# publish-pypi completes, the result is a public GitHub Release with no
# PyPI artifact, surfaced only as a "cancelled" run -- a status that reads
# as intentional/benign, not as an incomplete release. The release-outcome
# job at the bottom of this file fails loudly when github-release and
# publish-pypi disagree, but it cannot catch a run that was cancelled
# before it got a chance to execute at all (see that job's own comment).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Asset naming convention (locked):
  #   xrpl-camp-<version>-<os>-<arch>[.exe]
  #   checksums-<version>.txt
  build-binaries:
    # workflow_dispatch lets a human pick ANY branch or tag, defaulting to
    # the repo's default branch. Without this guard, a manual dispatch
    # against a branch would mint a GitHub Release and binaries named after
    # that branch (e.g. "main") instead of failing fast -- exactly the kind
    # of mistake someone doing manual release recovery under pressure could
    # make (this repo has already needed manual recovery once, for v1.0.6).
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 25
    strategy:
      # fail-fast is deliberately left at its default (true), not set to
      # false: if one platform leg fails, the other two are cancelled and
      # github-release/publish-pypi are skipped (GitHub Actions' documented
      # `needs` behaviour) -- no partial release lands on GitHub or PyPI.
      # The cost is that a release which was 2/3 working is fully blocked
      # until all three legs succeed together in the SAME run. Recovery is
      # "Re-run failed jobs" in the Actions UI (reuses artifacts already
      # uploaded by the legs that succeeded, re-runs only the failed leg and
      # its downstream jobs) -- NOT a fresh tag push (git rejects re-pushing
      # an existing tag) and NOT a fresh workflow_dispatch (rebuilds all
      # three legs from scratch). See also the concurrency comment above on
      # not re-dispatching against a tag that already has a run in flight.
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: macos-latest
            target: darwin-arm64
            ext: ""
          # darwin-x64 intentionally not built: Rosetta 2 translates
          # x86_64 binaries to run ON Apple Silicon hosts, it does NOT run
          # arm64 binaries on Intel hosts -- there is no reverse path, so
          # the darwin-arm64 binary above does not help Intel Mac users.
          # An earlier version of this comment claimed the opposite and was
          # wrong: it left Intel Mac users with a hard, total failure via
          # npm (no checksum entry for darwin-x64 -> ensureBinary() throws)
          # while npm/README.md promised "No Python required". Restoring a
          # real darwin-x64 leg needs a verified cross-build (e.g. a
          # Rosetta-hosted x86_64 Python toolchain on an arm64 runner) that
          # nobody has proven working yet, and this workflow cannot trigger
          # a real run to prove one out. Until that exists, Intel Mac users
          # are directed to `pipx install xrpl-camp` instead (pure Python,
          # unaffected). npm/README.md's "No Python required" line needs a
          # matching qualifier -- flagged for the coordinator, not edited
          # here (npm/README.md is a public surface owned outside this
          # domain).
          - os: windows-latest
            target: win-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - run: uv python install 3.12

      - run: uv venv

      - name: Install dependencies + PyInstaller
        run: uv pip install . "pyinstaller>=6.9.0,<7.0"

      - name: Build binary
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          uv run pyinstaller --onefile --name "xrpl-camp" --console \
            --collect-submodules rich \
            --collect-data xrpl \
            xrpl_camp/__main__.py
          OUTNAME="xrpl-camp-${VERSION}-${{ matrix.target }}${{ matrix.ext }}"
          mv "dist/xrpl-camp${{ matrix.ext }}" "dist/${OUTNAME}"
          echo "ASSET_NAME=${OUTNAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ env.ASSET_NAME }}

  github-release:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd artifacts
          sha256sum * > "checksums-${VERSION}.txt"
          cat "checksums-${VERSION}.txt"

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: artifacts/*

  # PyPI's Trusted Publisher registration (on PyPI's own project management
  # page -- not visible from GitHub, and not checkable with `gh`'s read-only
  # access) must list this exact repo + workflow filename ("publish.yml") +
  # environment name ("pypi") for the id-token: write OIDC handshake below to
  # succeed. It has worked at least once historically (PyPI currently serves
  # a version this repo published that way), but nothing on the GitHub side
  # can prove the registration still matches today. There is also no
  # workflow_dispatch-reachable dry run of just the OIDC handshake: every job
  # in this file is gated on refs/tags/v*, and `repository-url` below is left
  # at its default (real PyPI, no TestPyPI staging leg). The next real tag
  # push is simultaneously the first execution of this merged workflow and
  # the first real test of whether the OIDC trust relationship still holds.
  #
  # Before relying on this for a release, whoever owns the PyPI project's
  # Trusted Publisher settings should independently confirm the entry still
  # lists mcp-tool-shop-org/xrpl-camp + publish.yml + environment pypi. A
  # TestPyPI-targeted rehearsal leg (separate Trusted Publisher entry,
  # `repository-url: https://test.pypi.org/legacy/`, reachable via
  # workflow_dispatch bypassing the tag-only guard) would close the "no
  # cheaper way to find out first" gap, but needs a new PyPI-side Trusted
  # Publisher registration this domain cannot create -- flagged for the
  # coordinator/Director, not added here.
  publish-pypi:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # skip-existing defaults to false. Without it, a retry after a
          # false-negative from the verify step below (e.g. brief index-
          # propagation lag, or a transient failure reaching PyPI's read API
          # while the write/upload API was fine) re-runs this step, which
          # then hits PyPI's immutable-release rule ("400 File already
          # exists") on the identical sdist/wheel -- a SECOND, differently
          # worded failure that obscures the fact the original upload
          # actually succeeded. With it, re-running this step after a
          # real-but-unverified success is a safe no-op.
          skip-existing: true

      - name: Verify PyPI actually serves this version
        # Compensator for the whole defect class this file used to have:
        # a publish step can exit 0 while the registry silently doesn't
        # reflect it. Bounded retry (~2.5 min max) -- see script header.
        # Also checks artifact completeness (sdist + wheel both present),
        # not just that PyPI's current-version pointer moved.
        run: bash scripts/verify-pypi-publish.sh "${GITHUB_REF_NAME#v}"

  # Closing consistency check: if github-release published but publish-pypi
  # did not succeed, fail loudly instead of leaving a public GitHub Release
  # with no PyPI artifact and no alarm. `if: always()` lets this run even
  # though GitHub Actions' default `needs` behaviour would otherwise skip a
  # downstream job the moment any upstream job fails.
  #
  # Two known limits, both inherent to how Actions cancellation works and
  # not closeable from inside a single workflow run: (1) if the WHOLE run is
  # cancelled (see the concurrency comment above) before this job starts, it
  # may never execute either -- this closes the "upstream job failed but the
  # run kept going" gap, not the "run was cancelled outright" gap. (2) there
  # is no notification wiring anywhere in this domain (checked .github/,
  # scripts/, npm/ for slack|webhook|notify|discord|pagerduty|email|
  # issues/create -- no matches), so a red run here is only visible to
  # someone who looks at the Actions tab. Wiring an external notification
  # channel needs a secret this domain does not own -- flagged for the
  # coordinator/Director, not added here.
  release-outcome:
    name: Verify release outcome is consistent
    needs: [build-binaries, github-release, publish-pypi]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check that GitHub Release and PyPI publish agree
        run: |
          echo "build-binaries: ${{ needs.build-binaries.result }}"
          echo "github-release: ${{ needs.github-release.result }}"
          echo "publish-pypi:   ${{ needs.publish-pypi.result }}"

          if [ "${{ needs.github-release.result }}" = "success" ] && [ "${{ needs.publish-pypi.result }}" != "success" ]; then
            echo "::error::Release is INCONSISTENT for ${GITHUB_REF_NAME}: a GitHub Release was published, but publish-pypi did not succeed (result: ${{ needs.publish-pypi.result }}). PyPI does not have this release. Do not re-dispatch this workflow against the same tag -- check the Actions tab for an in-flight run first, then use 'Re-run failed jobs' rather than a fresh dispatch (see the concurrency comment near the top of this file)."
            exit 1
          fi

          echo "Release outcome is consistent (or nothing was expected to publish on this ref)."
