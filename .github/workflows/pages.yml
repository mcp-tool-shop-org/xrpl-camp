name: Deploy site to GitHub Pages

# Measured cost (run 26432941656, 2026-05-26, push trigger): ~2 billed
# runner-minutes -- build (~18s) and deploy (~9s), both ubuntu-latest.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Workflow-level default is least privilege. `pages: write` / `id-token:
# write` are scoped to the `deploy` job only (job-level permissions override
# workflow-level) -- `build` only checks out code and runs `npm ci` / `npm
# run build` against site/'s full transitive dependency tree, which never
# needed either scope. A compromised transitive dependency executing during
# `npm ci`/`npm run build` should not inherit Pages deploy or OIDC token
# scope it has no legitimate use for.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
