[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrpl-camp"
version = "1.3.1"
description = "Learn the XRP Ledger in one sitting — real transactions, portable proof, 10 minutes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" },
]
keywords = ["xrpl", "web3", "education", "ledger", "testnet"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
# Upper bounds are deliberate: this is an application shipped via
# pipx/PyPI/npm, not a library, so `dependencies` records what has actually
# been tested, not the widest range a downstream consumer might tolerate.
# xrpl-py had no upper bound in production and silently resolved to 5.1.0,
# under which the product's core transaction is rejected outright -- typer
# and rich were equally exposed to the same class of incident, just not yet
# hit. No committed lock file exists (uv.lock is gitignored) to fall back
# on, so these ceilings are the only floor against an untested major.
dependencies = [
    "typer>=0.9,<1.0",
    "rich>=13.7,<16.0",
    "xrpl-py>=5.0,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
xrpl-camp = "xrpl_camp.cli:run"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["xrpl_camp"]
