summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: bin
    globs:
      - bin/**
    role: code
  - name: root
    globs:
      - "*"
    role: config
  - name: scripts
    globs:
      - scripts/**
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: tests
    globs:
      - tests/**
    role: test
  - name: xrpl_camp
    globs:
      - xrpl_camp/**
    role: code
